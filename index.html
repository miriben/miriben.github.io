<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MathLearnSolve : cours de mathématiques, exercices corrigés et analyse de fonctions pour les élèves de 1ère Bac au Maroc."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#061a34" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MathLearnSolve" />
    <meta property="og:title" content="MathLearnSolve | Apprendre les maths au Maroc" />
    <meta
      property="og:description"
      content="Cours progressifs, exercices corrigés et analyse de fonctions pour la 1ère Bac."
    />
    <meta property="og:url" content="https://miriben.github.io/" />
    <meta property="og:image" content="https://miriben.github.io/brand-icon.png" />
    <link rel="canonical" href="https://miriben.github.io/" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand-icon.png" />
    <title>MathLearnSolve | Cours et exercices de maths au Maroc</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #142b47;
        background: #f5f7f2;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 660px;
        padding: 44px;
        border: 1px solid #dce4e8;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px #142b4714;
        text-align: center;
      }
      img {
        width: 120px;
        height: 120px;
        border-radius: 24px;
      }
      h1 {
        margin: 24px 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
      }
      p {
        color: #536578;
        font-size: 1.1rem;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 22px;
        border-radius: 12px;
        background: #163e69;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #d4ab53;
        outline-offset: 4px;
      }
      @media (max-width: 520px) {
        main {
          padding: 30px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand-icon.png" alt="Logo MathLearnSolve" width="120" height="120" />
      <h1>MathLearnSolve</h1>
      <p>
        Des cours progressifs, des exercices corrigés et l’analyse de fonctions
        pour accompagner les élèves de 1ère Bac au Maroc.
      </p>
      <a href="https://miriben.github.io/MathLearnSolvee/">Découvrir le site MathLearnSolve</a>
    </main>
  </body>
</html>
